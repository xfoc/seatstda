<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>補習班選位系統 - 雲端同步版</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 React 與 ReactDOM (Production 版本) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- 載入 Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 隱藏捲軸但保留滾動功能 (美化介面) */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* 點擊動畫 */
    .active-scale:active {
      transform: scale(0.96);
    }
  </style>

  <script type="module">
    // 匯入 Firebase 模組並掛載到全域變數，供 Babel 內的 React 使用
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.FirebaseAPI = {
      initializeApp, getAuth, signInAnonymously,
      getFirestore, doc, setDoc, onSnapshot, collection, updateDoc, deleteField
    };
    
    // 通知 React 可以開始初始化雲端服務了
    window.dispatchEvent(new Event('firebase-modules-ready'));
  </script>
</head>
<body class="bg-[#F9F9F9] font-sans selection:bg-black selection:text-white text-gray-900">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 定義座位的行與列
    const ROWS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
    const COLS = Array.from({ length: 12 }, (_, i) => i + 1);

    // 班系與班別結構定義
    const STRUCTURE = {
      '數學': ['數甲', '數乙', '數丙', '數丁', '數戊'],
      '英文': ['英L', '英B', '英R'],
      '國文': ['國A', '國甲'],
      '社會': ['社衝'],
      '自然': ['自然化學', '自然物理']
    };

    const ALL_CLASSES = Object.entries(STRUCTURE).flatMap(([dept, classes]) => 
      classes.map(cls => ({ dept, cls }))
    );

    const generateMockData = () => {
      const db = {};
      const SURNAMES = ['陳', '林', '黃', '張', '李', '王', '吳', '劉', '蔡', '楊', '許', '鄭', '謝', '洪', '郭', '邱', '曾', '廖', '賴', '徐'];
      const NAMES = ['家豪', '雅婷', '冠宇', '婉婷', '建宏', '佳穎', '承翰', '怡君', '柏翰', '詩婷', '宇軒', '怡如', '浩哲', '欣儀', '家誠', '珮瑜', '俊傑', '雅雯', '冠廷', '郁婷', '子瑄', '芷榕', '柏均', '品妍'];

      Object.values(STRUCTURE).flat().forEach(className => {
        db[className] = {};
        ROWS.forEach(row => {
          COLS.forEach(col => {
            if (Math.random() < 0.82) { // 82% 機率有人坐
              const seatId = `${row}${String(col).padStart(2, '0')}`;
              if (Math.random() < 0.08) {
                db[className][seatId] = { name: '已佔用', isBlocked: true, studentId: '' };
              } else {
                const name = SURNAMES[Math.floor(Math.random() * SURNAMES.length)] + NAMES[Math.floor(Math.random() * NAMES.length)];
                const studentId = '112' + Math.floor(Math.random() * 10000).toString().padStart(4, '0');
                db[className][seatId] = { name, studentId };
              }
            }
          });
        });
      });
      return db;
    };

    function SeatingSystem() {
      // 系統與雲端狀態
      const [step, setStep] = useState('LOGIN');
      const [passwordInput, setPasswordInput] = useState('');
      const [syncState, setSyncState] = useState('connecting'); // connecting, synced, offline
      
      const [selectedDept, setSelectedDept] = useState('');
      const [selectedClass, setSelectedClass] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [dbState, setDbState] = useState({});
      const [modalOpen, setModalOpen] = useState(false);
      const [editingSeat, setEditingSeat] = useState(null);
      const [formData, setFormData] = useState({ studentId: '', name: '' });
      const [toastMessage, setToastMessage] = useState('');

      const seatGridRef = useRef(null);
      const hasSeededCloud = useRef(false);

      useEffect(() => {
        let unsubscribe = null;

        const initCloud = async () => {
          try {
            // ==========================================
            // ⚠️ 替換這裡的 config ⚠️
            // 請將下方的 firebaseConfig 替換成您自己的設定！
            // ==========================================
            const firebaseConfig = {
              apiKey: "AIzaSyCavJtceAMrHgr88aZLL_PdgyBMJXWHtgk",
              authDomain: "seatstda-app.firebaseapp.com",
              projectId: "seatstda-app",
              storageBucket: "seatstda-app.firebasestorage.app",
              messagingSenderId: "34503169500D",
              appId: "1:34503169500:web:cb6832092d5cf08ac9ab19"
            };
            
            // 如果沒有填寫 API KEY，自動降級為單機模式
            if(firebaseConfig.apiKey === "您的_API_KEY") {
                 console.log("偵測到未設定 Firebase 金鑰，啟用單機測試模式");
                 const localData = localStorage.getItem('cram-school-local');
                 setDbState(localData ? JSON.parse(localData) : generateMockData());
                 setSyncState('offline');
                 return;
            }

            // 幫您的補習班取一個專屬的英文 ID，作為資料夾名稱
            const envAppId = 'my-cram-school-live'; 

            const FB = window.FirebaseAPI;
            const app = FB.initializeApp(firebaseConfig);
            const auth = FB.getAuth(app);
            const db = FB.getFirestore(app);

            // 存入全域變數供後續儲存使用
            window.dbInstance = db;
            window.cloudAppId = envAppId;

            // 強制先進行匿名驗證 (Firebase 規定要有身分才能讀寫)
            await FB.signInAnonymously(auth);

            // 設定資料庫監聽 (Real-time sync)
            const classesRef = FB.collection(db, 'classes');
            
            unsubscribe = FB.onSnapshot(classesRef, (snapshot) => {
              if (snapshot.empty && !hasSeededCloud.current) {
                // 如果雲端資料庫是空的，我們生成假資料並上傳
                hasSeededCloud.current = true;
                const initialData = generateMockData();
                setDbState(initialData); 
                
                // 批次寫入雲端
                Object.entries(initialData).forEach(async ([clsName, seats]) => {
                  const docRef = FB.doc(db, 'classes', clsName);
                  await FB.setDoc(docRef, seats);
                });
              } else {
                // 有資料則同步雲端資料到本地狀態
                const newDb = {};
                snapshot.forEach(doc => {
                  newDb[doc.id] = doc.data();
                });
                setDbState(newDb);
              }
              setSyncState('synced');
            }, (error) => {
              console.error("Sync Error:", error);
              setSyncState('offline');
              showToast('連線中斷，切換至單機模式');
            });

          } catch (error) {
            console.error("Cloud Initialization Error:", error);
            setSyncState('offline');
          }
        };

        if (window.FirebaseAPI) {
          initCloud();
        } else {
          window.addEventListener('firebase-modules-ready', initCloud);
        }

        return () => {
          if (unsubscribe) unsubscribe();
          window.removeEventListener('firebase-modules-ready', initCloud);
        };
      }, []);

      useEffect(() => {
        if (syncState === 'offline') {
          localStorage.setItem('cram-school-local', JSON.stringify(dbState));
        }
      }, [dbState, syncState]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (passwordInput === 'admin') {
          setStep('DEPT');
          setPasswordInput('');
        } else {
          showToast('密碼錯誤！');
          setPasswordInput('');
        }
      };

      const handleSeatClick = (seatId) => {
        setEditingSeat(seatId);
        const seatData = dbState[selectedClass]?.[seatId];
        const isBlocked = seatData?.isBlocked;
        
        setFormData({
          studentId: isBlocked ? '' : (seatData?.studentId || ''),
          name: isBlocked ? '' : (seatData?.name || '')
        });
        setModalOpen(true);
      };

      const saveToDatabase = async (seatId, payload, isDelete = false) => {
        // 先樂觀更新本地畫面
        setDbState(prev => {
          const newDb = { ...prev };
          if (!newDb[selectedClass]) newDb[selectedClass] = {};
          
          if (isDelete) {
            delete newDb[selectedClass][seatId];
          } else {
            newDb[selectedClass][seatId] = payload;
          }
          return newDb;
        });

        // 寫入雲端
        if (syncState === 'synced' && window.dbInstance && window.FirebaseAPI) {
          const FB = window.FirebaseAPI;
          const classDocRef = FB.doc(window.dbInstance, 'classes', selectedClass);
          try {
            if (isDelete) {
              await FB.updateDoc(classDocRef, { [seatId]: FB.deleteField() });
            } else {
              await FB.setDoc(classDocRef, { [seatId]: payload }, { merge: true });
            }
          } catch (e) {
            console.error("寫入雲端失敗", e);
            showToast('雲端同步延遲');
          }
        }
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (!formData.name.trim()) {
          showToast('請輸入姓名');
          return;
        }
        saveToDatabase(editingSeat, formData);
        setModalOpen(false);
        setSearchQuery('');
        showToast(`${editingSeat} 劃位成功`);
      };

      const handleBlock = () => {
        saveToDatabase(editingSeat, { name: '已佔用', isBlocked: true, studentId: '' });
        setModalOpen(false);
        showToast(`${editingSeat} 已標記為有人`);
      };

      const handleClear = () => {
        saveToDatabase(editingSeat, null, true);
        setModalOpen(false);
        showToast(`${editingSeat} 已取消劃位`);
      };

      // 神奇功能：幫我找空位
      const findRandomEmptySeat = () => {
        const currentClassData = dbState[selectedClass] || {};
        const emptySeats = [];
        ROWS.forEach(row => {
          COLS.forEach(col => {
            const seatId = `${row}${String(col).padStart(2, '0')}`;
            if (!currentClassData[seatId]) emptySeats.push(seatId);
          });
        });

        if (emptySeats.length === 0) {
          showToast('太熱門了，已經全部客滿！');
          return;
        }

        const randomSeat = emptySeats[Math.floor(Math.random() * emptySeats.length)];
        showToast(`幫你挑選了 ${randomSeat}！`);
        handleSeatClick(randomSeat);
      };

      const handleExport = () => {
        let csvContent = "\uFEFF座位,學號,姓名\n";
        const currentClassData = dbState[selectedClass] || {};
        
        ROWS.forEach(row => {
          COLS.forEach(col => {
            const seatId = `${row}${String(col).padStart(2, '0')}`;
            const student = currentClassData[seatId] || { studentId: '', name: '' };
            csvContent += `${seatId},${student.studentId},${student.name}\n`;
          });
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        const dateStr = new Date().toISOString().split('T')[0];
        link.setAttribute('download', `${selectedClass}_座位表_${dateStr}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('座位表已匯出');
      };

      if (step === 'LOGIN') {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 relative bg-white">
            
            {/* 雲端連線狀態 */}
            <div className="absolute top-6 right-6 flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-50 border border-gray-100 text-xs font-bold shadow-sm">
              <span className={`w-2.5 h-2.5 rounded-full ${syncState === 'synced' ? 'bg-[#39FF14] shadow-[0_0_8px_#39FF14]' : syncState === 'connecting' ? 'bg-yellow-400 animate-pulse' : 'bg-red-500'}`}></span>
              {syncState === 'synced' ? '即時雲端同步中' : syncState === 'connecting' ? '連線中...' : '單機模式 (未設定金鑰)'}
            </div>

            <div className="w-full max-w-sm">
              <div className="flex flex-col items-center mb-12">
                <div className="w-16 h-16 bg-black rounded-2xl flex items-center justify-center mb-6 shadow-xl shadow-black/10 relative overflow-hidden">
                   <div className="absolute inset-0 bg-white/20 w-1/2 -skew-x-12 translate-x-full animate-[shimmer_3s_infinite]"></div>
                   <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
                <h1 className="text-3xl font-extrabold text-black tracking-tight mb-2">雲端系統登入</h1>
                <p className="text-sm text-gray-500 font-medium">請輸入管理員密碼進入系統</p>
              </div>
              
              <form onSubmit={handleLogin} className="space-y-4">
                <input
                  type="password"
                  autoFocus
                  className="w-full bg-gray-50 border-2 border-transparent rounded-2xl px-6 py-4 focus:outline-none focus:bg-white focus:border-black text-center text-2xl tracking-[0.5em] font-bold transition-all placeholder:text-gray-300 placeholder:font-normal"
                  placeholder="••••"
                  value={passwordInput}
                  onChange={e => setPasswordInput(e.target.value)}
                />
                <button type="submit" className="w-full bg-black hover:bg-gray-800 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-black/20 active-scale">
                  進入系統
                </button>
              </form>
              
              <div className="mt-8 text-center">
                <span className="inline-flex items-center gap-2 bg-gray-50 text-gray-400 text-xs font-bold px-4 py-2 rounded-full tracking-wider">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                  預設密碼：admin
                </span>
              </div>
            </div>

            {toastMessage && (
              <div className="fixed top-10 bg-black text-white px-6 py-3 rounded-full shadow-2xl text-sm font-bold transition-all">
                {toastMessage}
              </div>
            )}
            
            <style dangerouslySetInnerHTML={{__html: `
              @keyframes shimmer {
                0% { transform: translateX(-150%) skewX(-12deg); }
                30%, 100% { transform: translateX(150%) skewX(-12deg); }
              }
            `}} />
          </div>
        );
      }

      if (step === 'DEPT' || step === 'CLASS') {
        return (
          <div className="min-h-screen bg-[#F9F9F9] p-6 md:p-12 relative">
            
            {/* 雲端連線狀態 */}
            <div className="absolute top-6 right-6 flex items-center gap-2 px-3 py-1.5 rounded-full bg-white border border-gray-100 text-xs font-bold shadow-sm">
              <span className={`w-2 h-2 rounded-full ${syncState === 'synced' ? 'bg-[#39FF14]' : syncState === 'connecting' ? 'bg-yellow-400' : 'bg-red-500'}`}></span>
              <span className="hidden md:inline">{syncState === 'synced' ? '雲端連線中' : '單機模式'}</span>
            </div>

            <div className="max-w-5xl mx-auto">
              <div className="flex justify-between items-end mb-12">
                <div>
                  <button 
                    onClick={() => step === 'CLASS' ? setStep('DEPT') : setStep('LOGIN')} 
                    className="mb-4 text-gray-400 hover:text-black transition-colors flex items-center gap-2 font-bold text-sm"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    {step === 'CLASS' ? '返回班系' : '登出'}
                  </button>
                  <h1 className="text-4xl md:text-5xl font-extrabold text-black tracking-tight">
                    {step === 'DEPT' ? '選擇班系' : selectedDept}
                  </h1>
                </div>
                {step === 'CLASS' && (
                  <div className="text-right">
                    <span className="block text-sm text-gray-400 font-bold mb-1">下一步</span>
                    <span className="text-xl font-bold text-black">請選擇班別</span>
                  </div>
                )}
              </div>
              
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                {step === 'DEPT' ? (
                  Object.keys(STRUCTURE).map(dept => (
                    <button 
                      key={dept}
                      onClick={() => { setSelectedDept(dept); setStep('CLASS'); }}
                      className="bg-white border-2 border-transparent hover:border-black p-8 rounded-3xl shadow-sm hover:shadow-xl transition-all flex flex-col items-center justify-center gap-6 group aspect-square active-scale"
                    >
                      <div className="w-16 h-16 rounded-full bg-gray-50 group-hover:bg-black group-hover:text-white flex items-center justify-center transition-all">
                        <span className="text-2xl font-black">{dept.charAt(0)}</span>
                      </div>
                      <span className="text-xl font-extrabold text-black">{dept}</span>
                    </button>
                  ))
                ) : (
                  STRUCTURE[selectedDept].map(cls => (
                    <button 
                      key={cls}
                      onClick={() => { setSelectedClass(cls); setStep('SEAT'); }}
                      className="bg-white p-6 rounded-3xl shadow-sm hover:shadow-xl transition-all flex flex-col items-start justify-between min-h-[140px] group border-2 border-transparent hover:border-black active-scale"
                    >
                      <span className="text-2xl font-extrabold text-black">{cls}</span>
                      <div className="w-full flex justify-end">
                        <div className="w-10 h-10 rounded-full bg-gray-50 group-hover:bg-black group-hover:text-white flex items-center justify-center transition-all">
                          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                        </div>
                      </div>
                    </button>
                  ))
                )}
              </div>
            </div>
          </div>
        );
      }

      const currentClassData = dbState[selectedClass] || {};
      const totalSeats = ROWS.length * COLS.length;
      const occupiedSeats = Object.keys(currentClassData).length;
      const availableSeats = totalSeats - occupiedSeats;

      const isHighlightMatch = (seatData) => {
        if (!searchQuery.trim() || !seatData || seatData.isBlocked) return false;
        const q = searchQuery.toLowerCase();
        return (seatData.name && seatData.name.toLowerCase().includes(q)) || 
               (seatData.studentId && seatData.studentId.toLowerCase().includes(q));
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#F9F9F9]">
          
          <div className="bg-white border-b border-gray-100 sticky top-0 z-30 shadow-sm">
            <div className="max-w-[1400px] mx-auto px-4 md:px-8 h-20 flex items-center justify-between gap-4">
              
              <div className="flex items-center gap-2 md:gap-4">
                <button onClick={() => setStep('CLASS')} className="p-2 -ml-2 rounded-full hover:bg-gray-100 transition-colors">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <div className="relative">
                  <select 
                    className="appearance-none bg-gray-100 hover:bg-gray-200 text-black font-extrabold text-xl md:text-2xl py-2 pl-4 pr-10 rounded-2xl cursor-pointer outline-none transition-colors border-none"
                    value={selectedClass}
                    onChange={(e) => setSelectedClass(e.target.value)}
                  >
                    {ALL_CLASSES.map(c => (
                      <option key={c.cls} value={c.cls}>{c.cls}</option>
                    ))}
                  </select>
                  <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </div>
                </div>

                {/* Desktop 雲端燈號 */}
                <div className="hidden lg:flex items-center gap-1.5 ml-4 px-2 py-1 rounded bg-gray-50 border border-gray-100 text-[10px] font-bold text-gray-400">
                  <span className={`w-1.5 h-1.5 rounded-full ${syncState === 'synced' ? 'bg-[#39FF14]' : syncState === 'connecting' ? 'bg-yellow-400' : 'bg-red-500'}`}></span>
                  {syncState === 'synced' ? 'LIVE' : syncState === 'connecting' ? 'SYNC' : 'OFF'}
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="hidden md:flex relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                  </div>
                  <input
                    type="text"
                    placeholder="尋找學生..."
                    className="bg-gray-100 border-transparent focus:bg-white focus:border-black focus:ring-2 focus:ring-black rounded-full py-2 pl-9 pr-4 text-sm font-bold w-48 transition-all outline-none"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-black">
                      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                  )}
                </div>
                
                <button 
                  onClick={findRandomEmptySeat}
                  className="hidden md:flex items-center gap-2 bg-black text-white hover:bg-gray-800 px-4 py-2 rounded-full text-sm font-bold shadow-md transition-all active-scale"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>
                  隨機空位
                </button>

                <button 
                  onClick={handleExport}
                  className="flex items-center justify-center bg-gray-100 hover:bg-gray-200 text-black w-10 h-10 md:w-auto md:px-4 md:py-2 rounded-full font-bold transition-all active-scale"
                  title="匯出CSV"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                  <span className="hidden md:inline ml-2 text-sm">匯出</span>
                </button>
              </div>
            </div>
          </div>

          <div className="md:hidden bg-white px-4 py-3 border-b border-gray-100 flex gap-2 shadow-sm relative z-20">
             <div className="relative flex-1">
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
                <input
                  type="text"
                  placeholder="尋人啟事..."
                  className="w-full bg-gray-100 border-transparent focus:bg-white focus:border-black rounded-full py-2.5 pl-9 pr-4 text-sm font-bold transition-all outline-none"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                />
              </div>
              <button 
                onClick={findRandomEmptySeat}
                className="bg-black text-white px-4 rounded-full text-sm font-bold flex items-center gap-1 active-scale"
              >
                 <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/></svg>
                 空位
              </button>
          </div>

          <div className="flex-1 overflow-x-auto p-4 md:p-8 no-scrollbar" ref={seatGridRef}>
            <div className="min-w-[800px] max-w-[1200px] mx-auto bg-white rounded-[2rem] shadow-sm border border-gray-100 p-8 md:p-12 mb-8">
              
              <div className="flex items-center justify-between mb-12">
                <div className="flex items-center gap-6">
                  <div>
                    <div className="text-3xl font-black text-black">{availableSeats}</div>
                    <div className="text-xs font-bold text-gray-400 mt-1 uppercase tracking-widest">Available</div>
                  </div>
                  <div className="w-px h-10 bg-gray-200"></div>
                  <div>
                    <div className="text-3xl font-black text-gray-400">{occupiedSeats}</div>
                    <div className="text-xs font-bold text-gray-400 mt-1 uppercase tracking-widest">Occupied</div>
                  </div>
                </div>
                
                <div className="hidden md:flex flex-col items-end w-48">
                   <div className="text-sm font-bold text-black mb-2">{Math.round((occupiedSeats/totalSeats)*100)}% 滿座率</div>
                   <div className="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
                      <div className="h-full bg-black rounded-full transition-all duration-500" style={{ width: `${(occupiedSeats/totalSeats)*100}%`}}></div>
                   </div>
                </div>
              </div>

              <div className="w-1/3 mx-auto h-16 bg-gradient-to-b from-gray-100 to-white rounded-b-3xl border border-t-0 border-gray-200 flex items-center justify-center mb-16 relative">
                <span className="text-black font-extrabold tracking-[0.5em] text-lg absolute -top-3 bg-white px-4">講台 FRONT</span>
              </div>

              <div className="flex flex-col gap-3 md:gap-4 select-none">
                {ROWS.map((row) => (
                  <div key={row} className="flex items-center justify-center gap-2">
                    <div className="w-8 text-center font-black text-gray-300 text-lg">{row}</div>
                    
                    <div className="flex gap-2">
                      {COLS.map((col) => {
                        const seatId = `${row}${String(col).padStart(2, '0')}`;
                        const seatData = currentClassData[seatId];
                        const isOccupied = !!seatData;
                        const isBlocked = seatData?.isBlocked;
                        const isAisle = col === 6;
                        const highlight = isHighlightMatch(seatData);
                        
                        return (
                          <React.Fragment key={seatId}>
                            <button
                              onClick={() => handleSeatClick(seatId)}
                              className={`
                                relative w-12 h-14 md:w-14 md:h-16 rounded-xl flex flex-col items-center justify-center transition-all duration-200
                                ${!isOccupied 
                                  ? 'bg-white border-2 border-gray-200 hover:border-black hover:shadow-md'
                                  : isBlocked
                                    ? 'bg-gray-100 border-2 border-gray-200'
                                    : 'bg-black border-2 border-black hover:bg-gray-900 shadow-md shadow-black/10' 
                                }
                                ${highlight ? 'ring-4 ring-[#39FF14] animate-pulse scale-110 z-10' : ''}
                              `}
                            >
                              <span className={`text-[10px] md:text-xs font-bold absolute top-1.5 md:top-2 
                                ${!isOccupied ? 'text-gray-400' : isBlocked ? 'text-gray-400' : 'text-gray-400'}
                              `}>
                                {seatId}
                              </span>
                              
                              {isOccupied && !isBlocked && (
                                <span className="text-[11px] md:text-[13px] font-extrabold text-white mt-3 w-full truncate text-center px-0.5">
                                  {seatData.name}
                                </span>
                              )}

                              {isBlocked && (
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="text-gray-400 mt-2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                              )}
                            </button>
                            {isAisle && <div className="w-6 md:w-10" />} 
                          </React.Fragment>
                        );
                      })}
                    </div>
                    
                    <div className="w-8 text-center font-black text-gray-300 text-lg">{row}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {modalOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/30 backdrop-blur-sm sm:p-4 transition-opacity">
              <div className="bg-white w-full sm:max-w-md rounded-t-[2rem] sm:rounded-[2rem] shadow-2xl overflow-hidden transition-transform transform translate-y-0 duration-300">
                
                <div className="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mt-4 mb-2 sm:hidden"></div>

                <div className="px-8 pt-4 pb-6 flex items-center justify-between border-b border-gray-100">
                  <h2 className="text-black text-2xl font-black tracking-tight">
                    座位 {editingSeat}
                  </h2>
                  <button onClick={() => setModalOpen(false)} className="bg-gray-100 hover:bg-gray-200 p-2 rounded-full text-black transition-colors active-scale">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  </button>
                </div>
                
                <form onSubmit={handleSave} className="p-8">
                  <div className="space-y-6">
                    <div>
                      <label htmlFor="studentId" className="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">學號 Student ID</label>
                      <input
                        id="studentId"
                        type="text"
                        className="w-full bg-gray-50 border-2 border-transparent focus:bg-white focus:border-black rounded-xl px-5 py-3.5 text-lg font-bold transition-all outline-none placeholder:font-normal placeholder:text-gray-300"
                        placeholder="可留空..."
                        value={formData.studentId}
                        onChange={(e) => setFormData({...formData, studentId: e.target.value})}
                      />
                    </div>
                    <div>
                      <label htmlFor="name" className="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">姓名 Name</label>
                      <input
                        id="name"
                        type="text"
                        required
                        autoFocus
                        className="w-full bg-gray-50 border-2 border-transparent focus:bg-white focus:border-black rounded-xl px-5 py-3.5 text-lg font-bold transition-all outline-none placeholder:font-normal placeholder:text-gray-300"
                        placeholder="輸入姓名..."
                        value={formData.name}
                        onChange={(e) => setFormData({...formData, name: e.target.value})}
                      />
                    </div>
                  </div>
                  
                  <div className="mt-10 flex flex-col gap-3">
                    <button
                      type="submit"
                      className="w-full py-4 bg-black text-white rounded-xl font-bold text-lg shadow-lg shadow-black/20 active-scale transition-all"
                    >
                      確認劃位
                    </button>
                    
                    <div className="grid grid-cols-2 gap-3 mt-2">
                      <button
                        type="button"
                        onClick={handleBlock}
                        className="py-3 bg-gray-100 hover:bg-gray-200 text-black rounded-xl font-bold text-sm transition-colors active-scale"
                      >
                        標記有人(反黑)
                      </button>
                      {currentClassData[editingSeat] && (
                        <button
                          type="button"
                          onClick={handleClear}
                          className="py-3 bg-[#FF3B30]/10 hover:bg-[#FF3B30]/20 text-[#FF3B30] rounded-xl font-bold text-sm transition-colors active-scale"
                        >
                          清空此座位
                        </button>
                      )}
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}

          {toastMessage && (
            <div className="fixed bottom-8 left-1/2 -translate-x-1/2 bg-black text-white px-6 py-3.5 rounded-full shadow-2xl text-sm font-bold flex items-center gap-3 z-50">
              <div className="w-2 h-2 rounded-full bg-[#39FF14]"></div>
              {toastMessage}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SeatingSystem />);
  </script>
</body>
</html>
