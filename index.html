<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>補習班選位系統 - 旗艦版 (支援匯入/匯出)</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 React 與 ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- 載入 Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .active-scale:active { transform: scale(0.96); }
    @keyframes shimmer {
      0% { transform: translateX(-150%) skewX(-12deg); }
      30%, 100% { transform: translateX(150%) skewX(-12deg); }
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.FirebaseAPI = {
      initializeApp, getAuth, signInAnonymously,
      getFirestore, doc, setDoc, onSnapshot, collection, updateDoc, deleteField
    };
    
    // 通知 React 可以開始初始化雲端服務
    window.dispatchEvent(new Event('firebase-modules-ready'));
  </script>
</head>
<body class="bg-[#F9F9F9] font-sans selection:bg-black selection:text-white text-gray-900">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ROWS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
    const COLS = Array.from({ length: 12 }, (_, i) => i + 1);

    const DEFAULT_STRUCTURE = {
      '數學': ['數甲', '數乙', '數丙', '數丁', '數戊'],
      '英文': ['英L', '英B', '英R'],
      '國文': ['國A', '國甲'],
      '社會': ['社衝'],
      '自然': ['自然化學', '自然物理']
    };

    const DEFAULT_USERS = {
      'admin': { role: 'admin', name: '最高管理員' }
    };

    // 假資料生成器 (僅在首次初始化使用)
    const generateMockData = (structure) => {
      const db = {};
      const SURNAMES = ['陳', '林', '黃', '張', '李', '王', '吳', '劉', '蔡', '楊'];
      const NAMES = ['家豪', '雅婷', '冠宇', '婉婷', '建宏', '佳穎', '承翰', '怡君', '柏翰', '詩婷'];

      Object.values(structure).flat().forEach(className => {
        db[className] = {};
        ROWS.forEach(row => {
          COLS.forEach(col => {
            if (Math.random() < 0.75) { 
              const seatId = `${row}${String(col).padStart(2, '0')}`;
              if (Math.random() < 0.1) {
                db[className][seatId] = { name: '保留佔用', isBlocked: true, studentId: '', recordedBy: '系統預設', updatedAt: new Date().toLocaleString() };
              } else {
                const name = SURNAMES[Math.floor(Math.random() * SURNAMES.length)] + NAMES[Math.floor(Math.random() * NAMES.length)];
                const studentId = '112' + Math.floor(Math.random() * 10000).toString().padStart(4, '0');
                db[className][seatId] = { name, studentId, recordedBy: '系統預設', updatedAt: new Date().toLocaleString() };
              }
            }
          });
        });
      });
      return db;
    };

    function AdminPanel({ usersDb, structureDb, onClose, onSaveUsers, onSaveStructure, currentAdminName }) {
      const [activeTab, setActiveTab] = useState('USERS');
      
      const [localUsers, setLocalUsers] = useState(usersDb || {});
      const [newPwd, setNewPwd] = useState('');
      const [newName, setNewName] = useState('');

      const [localStruct, setLocalStruct] = useState(structureDb || {});
      const [newDept, setNewDept] = useState('');
      const [newClasses, setNewClasses] = useState({});

      const handleAddUser = (e) => {
        e.preventDefault();
        if (!newPwd.trim() || !newName.trim()) return;
        if (localUsers[newPwd]) {
          alert("此密碼已被使用！");
          return;
        }
        setLocalUsers({ ...localUsers, [newPwd]: { role: 'user', name: newName } });
        setNewPwd('');
        setNewName('');
      };

      const handleRemoveUser = (pwd) => {
        if (localUsers[pwd].role === 'admin') return;
        const updated = { ...localUsers };
        delete updated[pwd];
        setLocalUsers(updated);
      };

      const handleAddDept = (e) => {
        e.preventDefault();
        if (!newDept.trim() || localStruct[newDept]) return;
        setLocalStruct({ ...localStruct, [newDept]: [] });
        setNewDept('');
      };

      const handleRemoveDept = (dept) => {
        const updated = { ...localStruct };
        delete updated[dept];
        setLocalStruct(updated);
      };

      const handleAddClass = (dept) => {
        const clsName = newClasses[dept];
        if (!clsName || !clsName.trim() || localStruct[dept].includes(clsName)) return;
        setLocalStruct({
          ...localStruct,
          [dept]: [...localStruct[dept], clsName.trim()]
        });
        setNewClasses({ ...newClasses, [dept]: '' });
      };

      const handleRemoveClass = (dept, clsName) => {
        setLocalStruct({
          ...localStruct,
          [dept]: localStruct[dept].filter(c => c !== clsName)
        });
      };

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
          <div className="bg-white w-full max-w-3xl h-[85vh] rounded-[2rem] shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95 duration-200">
            <div className="flex items-center justify-between p-6 border-b border-gray-100 bg-gray-50/50">
              <h2 className="text-2xl font-black tracking-tight flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                系統管理後台
              </h2>
              <button onClick={onClose} className="p-2 bg-gray-200 hover:bg-gray-300 rounded-full active-scale transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            </div>
            
            <div className="flex px-6 pt-4 border-b border-gray-100 gap-6">
              <button onClick={() => setActiveTab('USERS')} className={`pb-3 font-bold text-lg transition-colors border-b-4 ${activeTab === 'USERS' ? 'border-black text-black' : 'border-transparent text-gray-400 hover:text-black'}`}>帳號權限管理</button>
              <button onClick={() => setActiveTab('CLASSES')} className={`pb-3 font-bold text-lg transition-colors border-b-4 ${activeTab === 'CLASSES' ? 'border-black text-black' : 'border-transparent text-gray-400 hover:text-black'}`}>班系與班別管理</button>
            </div>

            <div className="flex-1 overflow-y-auto p-6 bg-[#F9F9F9]">
              {activeTab === 'USERS' && (
                <div className="space-y-8">
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h3 className="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4">新增使用者 (老師/助教)</h3>
                    <form onSubmit={handleAddUser} className="flex gap-4 items-end">
                      <div className="flex-1">
                         <label className="block text-xs font-bold text-gray-400 mb-1">顯示名稱 (例如: 王老師)</label>
                         <input type="text" required value={newName} onChange={e=>setNewName(e.target.value)} className="w-full bg-gray-50 focus:bg-white focus:ring-2 focus:ring-black border border-gray-200 rounded-xl px-4 py-2 font-bold outline-none" placeholder="輸入姓名"/>
                      </div>
                      <div className="flex-1">
                         <label className="block text-xs font-bold text-gray-400 mb-1">登入密碼</label>
                         <input type="text" required value={newPwd} onChange={e=>setNewPwd(e.target.value)} className="w-full bg-gray-50 focus:bg-white focus:ring-2 focus:ring-black border border-gray-200 rounded-xl px-4 py-2 font-bold outline-none" placeholder="輸入專屬密碼"/>
                      </div>
                      <button type="submit" className="bg-black hover:bg-gray-800 text-white font-bold px-6 py-2.5 rounded-xl transition-colors h-fit">新增帳號</button>
                    </form>
                  </div>
                  
                  <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div className="grid grid-cols-3 bg-gray-50 px-6 py-3 border-b border-gray-100 text-xs font-bold text-gray-400 uppercase">
                      <div>登入密碼 (Key)</div>
                      <div>顯示名稱 (Name)</div>
                      <div className="text-right">操作 (Action)</div>
                    </div>
                    {Object.entries(localUsers).map(([pwd, user]) => (
                      <div key={pwd} className="grid grid-cols-3 items-center px-6 py-4 border-b border-gray-50 last:border-0">
                        <div className="font-bold font-mono text-gray-600">{pwd}</div>
                        <div className="font-bold flex items-center gap-2">
                          {user.name}
                          {user.role === 'admin' && <span className="bg-yellow-100 text-yellow-700 text-[10px] px-2 py-0.5 rounded-full uppercase">管理員</span>}
                        </div>
                        <div className="text-right">
                          {user.role !== 'admin' && (
                             <button onClick={() => handleRemoveUser(pwd)} className="text-red-500 hover:bg-red-50 px-3 py-1 rounded-lg text-sm font-bold transition-colors">刪除</button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

            <div className="p-6 border-t border-gray-100 bg-white flex justify-end gap-3">
               <button onClick={onClose} className="px-6 py-3 font-bold text-gray-500 hover:text-black rounded-xl transition-colors">取消變更</button>
               <button onClick={() => { onSaveUsers(localUsers); onSaveStructure(localStruct); onClose(); }} className="bg-[#39FF14] hover:bg-[#32E012] text-black font-black px-8 py-3 rounded-xl transition-all shadow-md active-scale">
                 儲存所有設定並套用
               </button>
            </div>
          </div>
        </div>
      );
    }

    function SeatingSystem() {
      const [step, setStep] = useState('LOGIN');
      const [passwordInput, setPasswordInput] = useState('');
      const [syncState, setSyncState] = useState('connecting'); 
      
      const [usersDb, setUsersDb] = useState({});
      const [structureDb, setStructureDb] = useState({});
      const [dbState, setDbState] = useState({});
      
      const [currentUser, setCurrentUser] = useState(null); 
      
      const [selectedDept, setSelectedDept] = useState('');
      const [selectedClass, setSelectedClass] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [modalOpen, setModalOpen] = useState(false);
      const [adminPanelOpen, setAdminPanelOpen] = useState(false);
      const [editingSeat, setEditingSeat] = useState(null);
      const [formData, setFormData] = useState({ studentId: '', name: '' });
      const [toastMessage, setToastMessage] = useState('');

      const [isMultiSelect, setIsMultiSelect] = useState(false);
      const [selectedSeats, setSelectedSeats] = useState([]);

      const seatGridRef = useRef(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        let unsubClasses = null;
        let unsubUsers = null;
        let unsubStructure = null;

        const initCloud = async () => {
          try {
            // ==========================================
            // 請將下方的 firebaseConfig 替換成您自己的設定！
            // ==========================================
            const firebaseConfig = {
              apiKey: "AIzaSyCavJtceAMrHgr88aZLL_PdgyBMJXWHtgk",
              authDomain: "seatstda-app.firebaseapp.com",
              projectId: "seatstda-app",
              storageBucket: "seatstda-app.firebasestorage.app",
              messagingSenderId: "34503169500",
              appId: "1:34503169500:web:cb6832092d5cf08ac9ab19"
            };

            if(firebaseConfig.apiKey === "您的_API_KEY" || !firebaseConfig.apiKey) {
                 console.log("未設定 Firebase，使用單機模式");
                 setSyncState('offline');
                 const localSettings = JSON.parse(localStorage.getItem('cram-settings')) || { users: DEFAULT_USERS, structure: DEFAULT_STRUCTURE };
                 const localData = JSON.parse(localStorage.getItem('cram-data')) || generateMockData(localSettings.structure);
                 setUsersDb(localSettings.users);
                 setStructureDb(localSettings.structure);
                 setDbState(localData);
                 return;
            }

            const FB = window.FirebaseAPI;
            const app = FB.initializeApp(firebaseConfig);
            const auth = FB.getAuth(app);
            const db = FB.getFirestore(app);

            window.dbInstance = db;

            await FB.signInAnonymously(auth);

            // 修改讀取設定的路徑，為了避免與您的 classes 衝突，將設定放在 settings 集合
            const usersRef = FB.doc(db, 'settings', 'users');
            unsubUsers = FB.onSnapshot(usersRef, (docSnap) => {
              if (!docSnap.exists()) {
                FB.setDoc(usersRef, DEFAULT_USERS);
                setUsersDb(DEFAULT_USERS);
              } else {
                setUsersDb(docSnap.data());
              }
            }, e => console.error("Users Sync Error", e));

            const structRef = FB.doc(db, 'settings', 'structure');
            unsubStructure = FB.onSnapshot(structRef, (docSnap) => {
              if (!docSnap.exists()) {
                FB.setDoc(structRef, DEFAULT_STRUCTURE);
                setStructureDb(DEFAULT_STRUCTURE);
              } else {
                setStructureDb(docSnap.data());
              }
            }, e => console.error("Structure Sync Error", e));

            // 修改讀取資料的路徑為根目錄的 classes 集合，以符合您 Firebase 上的現有資料
            const classesRef = FB.collection(db, 'classes');
            unsubClasses = FB.onSnapshot(classesRef, (snapshot) => {
              if (snapshot.empty) {
                setTimeout(() => {
                   const initialData = generateMockData(DEFAULT_STRUCTURE);
                   setDbState(initialData); 
                   Object.entries(initialData).forEach(async ([clsName, seats]) => {
                     const docRef = FB.doc(db, 'classes', clsName);
                     await FB.setDoc(docRef, seats);
                   });
                }, 1000);
              } else {
                const newDb = {};
                snapshot.forEach(doc => { newDb[doc.id] = doc.data(); });
                setDbState(newDb);
              }
              setSyncState('synced');
            }, (error) => {
              console.error("Sync Error:", error);
              setSyncState('offline');
              showToast('連線中斷，切換至單機模式');
            });

          } catch (error) {
            console.error("Cloud Error:", error);
            setSyncState('offline');
          }
        };

        if (window.FirebaseAPI) initCloud();
        else window.addEventListener('firebase-modules-ready', initCloud);

        return () => {
          if (unsubClasses) unsubClasses();
          if (unsubUsers) unsubUsers();
          if (unsubStructure) unsubStructure();
          window.removeEventListener('firebase-modules-ready', initCloud);
        };
      }, []);

      useEffect(() => {
        if (syncState === 'offline') {
          localStorage.setItem('cram-settings', JSON.stringify({ users: usersDb, structure: structureDb }));
          localStorage.setItem('cram-data', JSON.stringify(dbState));
        }
      }, [dbState, usersDb, structureDb, syncState]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const user = usersDb[passwordInput];
        if (user) {
          setCurrentUser({ id: passwordInput, name: user.name, role: user.role });
          setStep('DEPT');
          setPasswordInput('');
        } else {
          showToast('查無此密碼，請重新輸入！');
          setPasswordInput('');
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setStep('LOGIN');
      };

      const handleSeatClick = (seatId) => {
        if (isMultiSelect) {
          setSelectedSeats(prev => 
            prev.includes(seatId) ? prev.filter(s => s !== seatId) : [...prev, seatId]
          );
          return;
        }

        setEditingSeat(seatId);
        const seatData = dbState[selectedClass]?.[seatId];
        const isBlocked = seatData?.isBlocked;
        
        setFormData({
          studentId: isBlocked ? '' : (seatData?.studentId || ''),
          name: isBlocked ? '' : (seatData?.name || '')
        });
        setModalOpen(true);
      };

      const toggleMultiSelect = () => {
        setIsMultiSelect(!isMultiSelect);
        setSelectedSeats([]);
      };

      const batchSaveToDatabase = async (seatIds, payloadFunction) => {
        const timeStr = new Date().toLocaleString();
        const updates = {};
        const localUpdates = {};

        seatIds.forEach(seatId => {
          const payload = payloadFunction(seatId);
          if (payload === null) {
            if(window.FirebaseAPI) updates[seatId] = window.FirebaseAPI.deleteField();
          } else {
            const finalPayload = { ...payload, recordedBy: currentUser.name, updatedAt: timeStr };
            updates[seatId] = finalPayload;
            localUpdates[seatId] = finalPayload;
          }
        });

        // 樂觀更新
        setDbState(prev => {
          const newDb = { ...prev };
          if (!newDb[selectedClass]) newDb[selectedClass] = {};
          
          seatIds.forEach(seatId => {
            if (payloadFunction(seatId) === null) {
               delete newDb[selectedClass][seatId];
            } else {
               newDb[selectedClass][seatId] = localUpdates[seatId];
            }
          });
          return newDb;
        });

        // 修改寫入雲端資料的路徑為根目錄的 classes 集合
        if (syncState === 'synced' && window.dbInstance && window.FirebaseAPI) {
          const FB = window.FirebaseAPI;
          const classDocRef = FB.doc(window.dbInstance, 'classes', selectedClass);
          try {
            await FB.setDoc(classDocRef, updates, { merge: true });
          } catch (e) {
            console.error("雲端批次寫入失敗", e);
            showToast('同步異常');
          }
        }
      };

      const handleSaveSingle = (e) => {
        e.preventDefault();
        if (!formData.name.trim()) {
          showToast('請輸入姓名');
          return;
        }
        batchSaveToDatabase([editingSeat], () => formData);
        setModalOpen(false);
        setSearchQuery('');
        showToast(`${editingSeat} 劃位成功`);
      };

      const handleBatchAction = (action) => {
        if (action === 'block') {
          batchSaveToDatabase(selectedSeats, () => ({ name: '保留佔用', isBlocked: true, studentId: '' }));
          showToast(`已保留 ${selectedSeats.length} 個座位`);
        } else if (action === 'clear') {
          batchSaveToDatabase(selectedSeats, () => null); 
          showToast(`已清空 ${selectedSeats.length} 個座位`);
        }
        setSelectedSeats([]);
        setIsMultiSelect(false);
      };

      const findRandomEmptySeat = () => {
        const currentClassData = dbState[selectedClass] || {};
        const emptySeats = [];
        ROWS.forEach(row => {
          COLS.forEach(col => {
            const seatId = `${row}${String(col).padStart(2, '0')}`;
            if (!currentClassData[seatId]) emptySeats.push(seatId);
          });
        });

        if (emptySeats.length === 0) {
          showToast('已經全部客滿！');
          return;
        }
        const randomSeat = emptySeats[Math.floor(Math.random() * emptySeats.length)];
        setIsMultiSelect(false);
        handleSeatClick(randomSeat);
        showToast(`幫你挑了 ${randomSeat}！`);
      };

      const saveSettingsToCloud = async (type, data) => {
        // 修改寫入設定的路徑為 settings 集合
        if (syncState === 'synced' && window.dbInstance && window.FirebaseAPI) {
           const FB = window.FirebaseAPI;
           const docRef = FB.doc(window.dbInstance, 'settings', type);
           await FB.setDoc(docRef, data);
        }
      };

      const handleExport = () => {
        let csvContent = "\uFEFF座位,學號,姓名,修改人員,修改時間\n";
        const currentClassData = dbState[selectedClass] || {};
        ROWS.forEach(row => {
          COLS.forEach(col => {
            const seatId = `${row}${String(col).padStart(2, '0')}`;
            const st = currentClassData[seatId] || { studentId: '', name: '', recordedBy: '', updatedAt: '' };
            csvContent += `${seatId},${st.studentId || ''},${st.name || ''},${st.recordedBy || ''},${st.updatedAt || ''}\n`;
          });
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${selectedClass}_座位表_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // 處理 CSV 匯入邏輯
      const handleImportCSV = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const text = event.target.result;
            // 支援 \n 或 \r\n 換行符號
            const lines = text.split(/\r?\n/);
            
            const updates = {};
            const localUpdates = {};
            const timeStr = new Date().toLocaleString();
            let validCount = 0;

            // 從第二行開始讀取 (跳過標題列)
            for (let i = 1; i < lines.length; i++) {
              let line = lines[i].trim();
              if (!line) continue;

              // 處理可能的雙引號 (簡單替換)
              line = line.replace(/(^"|"$)/g, '');
              const cols = line.split(',');

              const seatId = cols[0]?.trim();
              const studentId = cols[1]?.trim() || '';
              const name = cols[2]?.trim() || '';

              // 基本驗證：確認 seatId 有值，且姓名有填寫才匯入
              if (seatId && name) {
                const isBlocked = (name === '已佔用' || name === '保留佔用');
                const payload = {
                  studentId: isBlocked ? '' : studentId,
                  name: name,
                  isBlocked: isBlocked,
                  recordedBy: currentUser.name,
                  updatedAt: timeStr
                };
                updates[seatId] = payload;
                localUpdates[seatId] = payload;
                validCount++;
              }
            }

            if (validCount > 0) {
              // 樂觀更新本地資料
              setDbState(prev => {
                const newDb = { ...prev };
                if (!newDb[selectedClass]) newDb[selectedClass] = {};
                // 只合併更新有資料的座位，不覆蓋原本其他的位子
                newDb[selectedClass] = { ...newDb[selectedClass], ...localUpdates };
                return newDb;
              });

              // 修改寫入雲端資料的路徑為根目錄的 classes 集合
              if (syncState === 'synced' && window.dbInstance && window.FirebaseAPI) {
                const FB = window.FirebaseAPI;
                const classDocRef = FB.doc(window.dbInstance, 'classes', selectedClass);
                await FB.setDoc(classDocRef, updates, { merge: true });
              }
              showToast(`成功匯入 ${validCount} 筆座位資料！`);
            } else {
              showToast('沒有找到可匯入的資料，請確認表格格式');
            }
          } catch (err) {
            console.error(err);
            showToast('匯入失敗，請確認檔案格式是否正確');
          }
          // 清空 input 讓下次選同一個檔案也能觸發
          e.target.value = null;
        };
        // 用 UTF-8 讀取，配合匯出時加入的 BOM
        reader.readAsText(file, 'UTF-8');
      };

                <span className="inline-flex items-center gap-2 bg-gray-50 text-gray-400 text-xs font-bold px-4 py-2 rounded-full tracking-wider">預設管理員密碼：admin</span>
              </div>
            </div>
            {toastMessage && <div className="fixed top-10 bg-black text-white px-6 py-3 rounded-full text-sm font-bold">{toastMessage}</div>}
          </div>

      if (step === 'DEPT' || step === 'CLASS') {
        return (
          <div className="min-h-screen bg-[#F9F9F9] p-6 md:p-12 relative">
            <div className="absolute top-6 right-6 flex items-center gap-4">

                 <button onClick={() => setAdminPanelOpen(true)} className="bg-black text-white text-xs font-bold px-4 py-2 rounded-full shadow-md active-scale flex items-center gap-2">

                    管理後台
                 </button>

               <div className="flex items-center gap-3 bg-white px-4 py-2 rounded-full border border-gray-100 shadow-sm text-sm font-bold">
                 <span className="text-gray-400">Hi, {currentUser.name}</span>
                 <div className="w-px h-4 bg-gray-200"></div>
                 <button onClick={handleLogout} className="text-red-500 hover:text-red-600 active-scale">登出</button>
               </div>
            </div>

            <div className="max-w-5xl mx-auto mt-12 md:mt-20">
              <div className="flex justify-between items-end mb-12">
                <div>
                  {step === 'CLASS' && (
                    <button onClick={() => setStep('DEPT')} className="mb-4 text-gray-400 hover:text-black transition-colors flex items-center gap-2 font-bold text-sm">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                      返回班系
                    </button>

                  <h1 className="text-4xl md:text-5xl font-extrabold text-black tracking-tight">{step === 'DEPT' ? '選擇班系' : selectedDept}</h1>
                </div>
              </div>
              
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                {step === 'DEPT' ? (
                  Object.keys(structureDb).map(dept => (
                    <button key={dept} onClick={() => { setSelectedDept(dept); setStep('CLASS'); }} className="bg-white border-2 border-transparent hover:border-black p-8 rounded-3xl shadow-sm hover:shadow-xl transition-all flex flex-col items-center justify-center gap-6 group aspect-square active-scale">
                      <div className="w-16 h-16 rounded-full bg-gray-50 group-hover:bg-black group-hover:text-white flex items-center justify-center transition-all">

                      <span className="text-2xl font-extrabold">{cls}</span>
                      <div className="w-full flex justify-end">
                        <div className="w-10 h-10 rounded-full bg-gray-50 group-hover:bg-black group-hover:text-white flex items-center justify-center transition-all">
                          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                        </div>
                      </div>
                    </button>
                  ))
                )}
              </div>
            </div>
            
            {adminPanelOpen && <AdminPanel usersDb={usersDb} structureDb={structureDb} onClose={() => setAdminPanelOpen(false)} onSaveUsers={(data) => { setUsersDb(data); saveSettingsToCloud('users', data); }} onSaveStructure={(data) => { setStructureDb(data); saveSettingsToCloud('structure', data); }} />}
            {toastMessage && <div className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-black text-white px-6 py-3 rounded-full text-sm font-bold z-50">{toastMessage}</div>}
          </div>
        );
      }

      const currentClassData = dbState[selectedClass] || {};
      const totalSeats = ROWS.length * COLS.length;
      const occupiedSeats = Object.keys(currentClassData).length;
      const availableSeats = totalSeats - occupiedSeats;
      const ALL_CLASSES = Object.entries(structureDb).flatMap(([dept, classes]) => classes.map(cls => ({ dept, cls })));

      const isHighlightMatch = (seatData) => {
        if (!searchQuery.trim() || !seatData || seatData.isBlocked) return false;
        const q = searchQuery.toLowerCase();
        return (seatData.name && seatData.name.toLowerCase().includes(q)) || (seatData.studentId && seatData.studentId.toLowerCase().includes(q));
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#F9F9F9]">
          
          <div className="bg-white border-b border-gray-100 sticky top-0 z-30 shadow-sm">
            <div className="max-w-[1400px] mx-auto px-4 md:px-8 h-20 flex items-center justify-between gap-4">
              <div className="flex items-center gap-2 md:gap-4">
                <button onClick={() => setStep('CLASS')} className="p-2 -ml-2 rounded-full hover:bg-gray-100 transition-colors">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <div className="relative">
                  <select className="appearance-none bg-gray-100 hover:bg-gray-200 text-black font-extrabold text-xl md:text-2xl py-2 pl-4 pr-10 rounded-2xl cursor-pointer outline-none transition-colors border-none" value={selectedClass} onChange={(e) => {setSelectedClass(e.target.value); setIsMultiSelect(false); setSelectedSeats([]); }}>
                    {ALL_CLASSES.map(c => <option key={c.cls} value={c.cls}>{c.cls}</option>)}
                  </select>
                  <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2 md:gap-3">
                <div className="hidden md:flex relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                  </div>
                  <input type="text" placeholder="尋找學生..." className="bg-gray-100 focus:bg-white focus:ring-2 focus:ring-black rounded-full py-2 pl-9 pr-4 text-sm font-bold w-48 outline-none" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                </div>
                
                <button onClick={toggleMultiSelect} className={`hidden md:flex items-center gap-2 px-4 py-2 rounded-full text-sm font-bold transition-all border-2 active-scale ${isMultiSelect ? 'bg-[#39FF14] text-black border-[#39FF14] shadow-md' : 'bg-white border-gray-200 hover:border-black'}`}>
                   <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11 12H3"/><path d="M16 6H3"/><path d="M16 18H3"/><path d="M21 12h-6"/></svg>
                   {isMultiSelect ? '關閉多選' : '多選模式'}
                </button>

                <button onClick={findRandomEmptySeat} className="hidden md:flex items-center gap-2 bg-black text-white hover:bg-gray-800 px-4 py-2 rounded-full text-sm font-bold shadow-md active-scale">
                  隨機空位
                </button>
                
                <div className="hidden md:flex items-center bg-gray-100 rounded-full overflow-hidden border border-gray-200">
                  <button onClick={handleExport} className="flex items-center hover:bg-gray-200 text-black px-4 py-2 font-bold active-scale justify-center transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                    <span className="ml-2 text-sm">匯出</span>
                  </button>
                  <div className="w-px h-4 bg-gray-300"></div>
                  <button onClick={() => fileInputRef.current.click()} className="flex items-center hover:bg-gray-200 text-black px-4 py-2 font-bold active-scale justify-center transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                    <span className="ml-2 text-sm">匯入</span>
                  </button>
                </div>
                
                <div className="md:hidden flex gap-2">
                   <button onClick={handleExport} className="flex items-center justify-center bg-gray-100 text-black w-10 h-10 rounded-full font-bold active-scale">
                     <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                   </button>
                   <button onClick={() => fileInputRef.current.click()} className="flex items-center justify-center bg-gray-100 text-black w-10 h-10 rounded-full font-bold active-scale">
                     <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                   </button>
                   <button onClick={handleLogout} className="flex items-center justify-center bg-red-100 text-red-500 w-10 h-10 rounded-full font-bold active-scale">
                     <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                   </button>
                </div>

                <input type="file" accept=".csv" ref={fileInputRef} className="hidden" onChange={handleImportCSV} />
              </div>
            </div>
          </div>

          <div className="md:hidden bg-white px-4 py-3 border-b border-gray-100 flex gap-2 shadow-sm relative z-20 overflow-x-auto no-scrollbar">
             <div className="relative flex-1 min-w-[150px]">
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
                <input type="text" placeholder="尋人啟事" className="w-full bg-gray-100 focus:bg-white rounded-full py-2.5 pl-9 pr-4 text-sm font-bold outline-none" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />

              <button onClick={toggleMultiSelect} className={`px-4 rounded-full text-sm font-bold whitespace-nowrap active-scale ${isMultiSelect ? 'bg-[#39FF14] text-black' : 'bg-gray-100 text-black'}`}>

          <div className="flex-1 overflow-x-auto p-4 md:p-8 no-scrollbar pb-32" ref={seatGridRef}>
            <div className="min-w-[800px] max-w-[1200px] mx-auto bg-white rounded-[2rem] shadow-sm border border-gray-100 p-8 md:p-12 mb-8">
              <div className="flex items-center justify-between mb-12">
                <div className="flex items-center gap-6">
                  <div>
                    <div className="text-3xl font-black text-black">{availableSeats}</div>
                    <div className="text-xs font-bold text-gray-400 mt-1 uppercase tracking-widest">Available</div>
                  </div>
                  <div className="w-px h-10 bg-gray-200"></div>
                  <div>
                    <div className="text-3xl font-black text-gray-400">{occupiedSeats}</div>
                    <div className="text-xs font-bold text-gray-400 mt-1 uppercase tracking-widest">Occupied</div>
                  </div>
                </div>
                <div className="hidden md:flex flex-col items-end w-48">
                   <div className="text-sm font-bold text-black mb-2">{Math.round((occupiedSeats/totalSeats)*100)}% 滿座率</div>
                   <div className="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
                      <div className="h-full bg-black rounded-full transition-all duration-500" style={{ width: `${(occupiedSeats/totalSeats)*100}%`}}></div>
                   </div>
                </div>
              </div>

              <div className="w-1/3 mx-auto h-16 bg-gradient-to-b from-gray-100 to-white rounded-b-3xl border border-t-0 border-gray-200 flex items-center justify-center mb-16 relative">
                <span className="text-black font-extrabold tracking-[0.5em] text-lg absolute -top-3 bg-white px-4">講台 FRONT</span>
              </div>

              <div className="flex flex-col gap-3 md:gap-4 select-none">
                {ROWS.map((row) => (
                  <div key={row} className="flex items-center justify-center gap-2">
                    <div className="w-8 text-center font-black text-gray-300 text-lg">{row}</div>
                    <div className="flex gap-2">
                      {COLS.map((col) => {
                        const seatId = `${row}${String(col).padStart(2, '0')}`;
                        const seatData = currentClassData[seatId];
                        const isOccupied = !!seatData;
                        const isBlocked = seatData?.isBlocked;
                        const isSelected = selectedSeats.includes(seatId);
                        const isAisle = col === 6;
                        const highlight = isHighlightMatch(seatData);
                        
                        return (
                          <React.Fragment key={seatId}>
                            <button onClick={() => handleSeatClick(seatId)} className={`
                                relative w-12 h-14 md:w-14 md:h-16 rounded-xl flex flex-col items-center justify-center transition-all duration-200
                                ${isMultiSelect && isSelected ? 'ring-4 ring-[#39FF14] bg-[#39FF14]/10 shadow-lg scale-105 z-10 border-transparent' : ''}
                                ${!isMultiSelect && highlight ? 'ring-4 ring-[#39FF14] animate-pulse scale-110 z-10' : ''}
                                ${!isSelected && !isOccupied ? 'bg-white border-2 border-gray-200 hover:border-black hover:shadow-md' : ''}
                                ${!isSelected && isOccupied && isBlocked ? 'bg-gray-100 border-2 border-gray-200' : ''}
                                ${!isSelected && isOccupied && !isBlocked ? 'bg-black border-2 border-black hover:bg-gray-900 shadow-md shadow-black/10' : ''}
                              `}>
                              <span className={`text-[10px] md:text-xs font-bold absolute top-1.5 md:top-2 ${!isOccupied ? 'text-gray-400' : isBlocked ? 'text-gray-400' : 'text-gray-400'}`}>{seatId}</span>
                              {isOccupied && !isBlocked && <span className="text-[11px] md:text-[13px] font-extrabold text-white mt-3 w-full truncate text-center px-0.5">{seatData.name}</span>}
                              {isBlocked && <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="text-gray-400 mt-2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>}
                            </button>
                            {isAisle && <div className="w-6 md:w-10" />} 
                          </React.Fragment>
                        );
                      })}
                    </div>
                    <div className="w-8 text-center font-black text-gray-300 text-lg">{row}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {isMultiSelect && selectedSeats.length > 0 && (
            <div className="fixed bottom-8 left-1/2 -translate-x-1/2 bg-black text-white px-3 py-3 rounded-2xl shadow-2xl flex items-center gap-4 z-40 animate-in slide-in-from-bottom-10">
               <span className="pl-4 font-bold whitespace-nowrap hidden md:inline">已選取 {selectedSeats.length} 個座位</span>
               <span className="pl-3 font-bold md:hidden">{selectedSeats.length} 席</span>
               <div className="flex gap-2">
                 <button onClick={() => handleBatchAction('block')} className="bg-white/10 hover:bg-white/20 px-4 py-2.5 rounded-xl font-bold text-sm transition-colors whitespace-nowrap">標記保留</button>
                 <button onClick={() => handleBatchAction('clear')} className="bg-red-500 hover:bg-red-600 px-4 py-2.5 rounded-xl font-bold text-sm transition-colors whitespace-nowrap">一鍵清空</button>
               </div>
            </div>
          )}

          {modalOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/30 backdrop-blur-sm sm:p-4 transition-opacity">
              <div className="bg-white w-full sm:max-w-md rounded-t-[2rem] sm:rounded-[2rem] shadow-2xl overflow-hidden animate-in slide-in-from-bottom-full sm:slide-in-from-bottom-10 duration-300">
                <div className="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mt-4 mb-2 sm:hidden"></div>
                <div className="px-8 pt-4 pb-6 flex items-center justify-between border-b border-gray-100">
                  <h2 className="text-black text-2xl font-black tracking-tight">座位 {editingSeat}</h2>
                  <button onClick={() => setModalOpen(false)} className="bg-gray-100 hover:bg-gray-200 p-2 rounded-full text-black transition-colors active-scale">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  </button>
                </div>
                
                <form onSubmit={handleSaveSingle} className="p-8">
                  {currentClassData[editingSeat]?.recordedBy && (
                    <div className="mb-6 bg-gray-50 rounded-xl p-3 flex items-start gap-3 border border-gray-100">
                      <div className="mt-0.5 text-gray-400">
                         <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                      </div>
                      <div>
                        <div className="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-0.5">最後修改紀錄</div>
                        <div className="text-xs font-bold text-gray-700">{currentClassData[editingSeat].recordedBy} <span className="font-normal text-gray-400">於 {currentClassData[editingSeat].updatedAt}</span></div>
                      </div>
                    </div>
                  )}

                  <div className="space-y-6">
                    <div>
                      <label className="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">學號</label>
                      <input type="text" className="w-full bg-gray-50 focus:bg-white focus:border-black rounded-xl px-5 py-3.5 text-lg font-bold border-2 border-transparent outline-none" placeholder="可留空..." value={formData.studentId} onChange={(e) => setFormData({...formData, studentId: e.target.value})} />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">姓名</label>
                      <input type="text" required autoFocus className="w-full bg-gray-50 focus:bg-white focus:border-black rounded-xl px-5 py-3.5 text-lg font-bold border-2 border-transparent outline-none" placeholder="輸入姓名..." value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} />
                    </div>
                  </div>
                  
                  <div className="mt-10 flex flex-col gap-3">
                    <button type="submit" className="w-full py-4 bg-black text-white rounded-xl font-bold text-lg shadow-lg active-scale transition-all">確認劃位</button>
                    <div className="grid grid-cols-2 gap-3 mt-2">
                      <button type="button" onClick={() => { batchSaveToDatabase([editingSeat], () => ({ name: '保留佔用', isBlocked: true, studentId: '' })); setModalOpen(false); }} className="py-3 bg-gray-100 hover:bg-gray-200 text-black rounded-xl font-bold text-sm active-scale">標記保留</button>
                      {currentClassData[editingSeat] && <button type="button" onClick={() => { batchSaveToDatabase([editingSeat], () => null); setModalOpen(false); }} className="py-3 bg-red-50 text-red-500 rounded-xl font-bold text-sm active-scale hover:bg-red-100">清空座位</button>}
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}

          {toastMessage && <div className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-black text-white px-6 py-3.5 rounded-full shadow-2xl text-sm font-bold flex items-center gap-3 z-50"><div className="w-2 h-2 rounded-full bg-[#39FF14]"></div>{toastMessage}</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SeatingSystem />);
  </script>
</body>
</html>
